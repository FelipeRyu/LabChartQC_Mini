databases:
  # 1. Base de Datos (PostgreSQL Gratuita)
  - name: labchartqc-db
    plan: free
    postgresMajorVersion: "15"

services:

  # 2. Backend (FastAPI - Web Service Gratuito)
  - type: web
    name: labchartqc-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: labchartqc-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.12

  # 3. Frontend (React/Vite - Static Site Gratuito)
  - type: web
    name: labchartqc-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && export VITE_API_URL=https://$VITE_API_URL && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: labchartqc-backend
          property: host
